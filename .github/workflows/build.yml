name: Build Fisheye StitchR

# Runs on every version tag (v0.9-beta, v1.0 ...) and on demand from the Actions tab.
# A manual run builds and tests everything but does not publish a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest        # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt pyinstaller
      # Tests run on the machine that builds the app, with the libraries it just installed.
      - name: Tests
        run: python -m pytest -q
      - name: Build the app
        run: python build_app.py
      # Launch the BUILT app and let it quit itself. Catches a bundle that is missing a library.
      - name: Launch the built app
        run: |
          "dist/Fisheye StitchR.app/Contents/MacOS/Fisheye StitchR" --quit-after-ms=4000
      - name: Build the disk image
        # DMG, not ZIP, so macOS does not run the app from a quarantined download location.
        # Retried because hdiutil sometimes fails with "Resource busy" on GitHub's runners.
        run: |
          for attempt in 1 2 3; do
            rm -rf dmg_stage FisheyeStitchR-Mac-AppleSilicon.dmg
            mkdir dmg_stage
            ditto "dist/Fisheye StitchR.app" "dmg_stage/Fisheye StitchR.app"
            ln -s /Applications dmg_stage/Applications
            cp installers/open_me_first_mac.txt "dmg_stage/Open Me First.txt"
            if hdiutil create -volname "Fisheye StitchR" -srcfolder dmg_stage -ov -format UDZO FisheyeStitchR-Mac-AppleSilicon.dmg; then
              exit 0
            fi
            echo "hdiutil failed on attempt $attempt; waiting before retry"
            sleep 20
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: FisheyeStitchR-Mac
          path: FisheyeStitchR-Mac-AppleSilicon.dmg

  release:
    needs: build-mac
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          files: FisheyeStitchR-Mac/FisheyeStitchR-Mac-AppleSilicon.dmg
          body: |
            ## Fisheye StitchR ${{ github.ref_name }}

            **Mac (Apple Silicon: M1, M2, M3, M4)**: download FisheyeStitchR-Mac-AppleSilicon.dmg, open it, and drag Fisheye StitchR into Applications. The first time you open it, macOS shows a security warning because the app is not notarized. Click Done, then System Settings > Privacy & Security > Open Anyway. The disk image includes an "Open Me First.txt" with the steps.
